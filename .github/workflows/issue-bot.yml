name: Issue Assistant
on:
  issues:
    types: [opened, closed]

jobs:
  handle-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Process Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const { action, issue } = context.payload;
            
            if (action === 'opened') {
              // Apply the bug label
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['bug']
              });

              // Post the opening comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Thanks for reporting this to ClassCharts Improver! I’ve logged this as a bug and alerted James. To help us investigate, please attach your debug file—here is a [guide on how to retrieve it](https://classchartsimprover.pages.dev/debugfile)."
              });
            }

            if (action === 'closed') {
              // Post the improved closing comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Thank you for contributing! Your input helps us squash bugs and makes the extension better for the entire community.\n\nWe’d love to hear about your experience with our support process. You can leave a [Feedback review on our website](https://classchartsimprover.pages.dev/gitissuefeedback.html) to help us improve."
              });
            }

      - name: Send Email Notification (Opened Only)
        if: github.event.action == 'opened'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "ClassCharts Improver: New Bug Reported (#${{ github.event.issue.number }})"
          to: ${{ secrets.MY_EMAIL_ADDRESS }}
          from: GitHub Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            A new issue has been opened and labeled as a bug.
            
            Title: ${{ github.event.issue.title }}
            User: ${{ github.event.issue.user.login }}
            Link: ${{ github.event.issue.html_url }}
